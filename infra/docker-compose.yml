services:
    redis:
        image: redis:latest
        container_name: midnightops_redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - midnightops_network

    postgres:
        image: postgres:latest
        container_name: midnightops_postgres
        environment:
            POSTGRES_USER: midnightops
            POSTGRES_PASSWORD: midnightops
            POSTGRES_DB: midnightops_db
        ports:
            - "5432:5432"
        volumes:
            - ./initdb:/docker-entrypoint-initdb.d
            - pgdata:/var/lib/postgresql
        networks:
            - midnightops_network

    backend:
        build:
            context: ../backend
            dockerfile: Dockerfile
        container_name: midnightops_backend
        ports:
            - "3000:3000"
        expose:
            - "3000"
        environment:
            REDIS_HOST: redis
            REDIS_PORT: 6379
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_USER: midnightops
            POSTGRES_PASSWORD: midnightops
            POSTGRES_DB: midnightops_db
            VIRTUAL_HOST: midnightops.soigneux.works
            VIRTUAL_PORT: 3000
            VIRTUAL_PROTO: http
            VIRTUAL_PATH: /api,/api/
            LETSENCRYPT_HOST: midnightops.soigneux.works
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.backend.rule=Host(`${DOMAIN_NAME:-midnightops.soigneux.works}`) && (PathPrefix(`/api`))"
            - "traefik.http.routers.backend.entrypoints=websecure"
            - "traefik.http.routers.backend.tls=true"
            - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
            - "traefik.http.services.backend.loadbalancer.server.port=3000"
        networks:
            - midnightops_network

    frontend:
        build:
            context: ../frontend
            dockerfile: Dockerfile
            args:
                VITE_API_URL: /api/v1
        container_name: midnightops_frontend
        environment:
            VITE_API_URL: /api/v1
            VIRTUAL_HOST: midnightops.soigneux.works
            VIRTUAL_PORT: 80
            VIRTUAL_PROTO: http
            LETSENCRYPT_HOST: midnightops.soigneux.works
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.frontend.rule=Host(`midnightops.soigneux.works`)"
            - "traefik.http.routers.frontend.entrypoints=websecure"
            - "traefik.http.routers.frontend.tls=true"
            - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
            - "traefik.http.services.frontend.loadbalancer.server.port=80"
        networks:
            - midnightops_network

    traefik:
        image: traefik:v3.6
        container_name: midnightops_traefik
        command:
            - "--api.insecure=false"
            - "--api.dashboard=false"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.file.directory=/etc/traefik/dynamic"
            - "--providers.file.watch=true"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
            - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
            - "--entrypoints.websecure.address=:443"
            - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
            - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
            - "--certificatesresolvers.letsencrypt.acme.email=lukas.soigneux@gmail.com"
            - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./letsencrypt:/letsencrypt
            - ./traefik/dynamic:/etc/traefik/dynamic
        networks:
            - midnightops_network


    mailserver:
        image: docker.io/mailserver/docker-mailserver:latest
        hostname: mail
        domainname: soigneux.works
        container_name: mailserver
        env_file: mailserver.env
        user: "${UID}:${GID}" 
        ports:
            - "25:25"      # SMTP
            - "587:587"    # Submission
            - "993:993"    # IMAPS
            - "143:143"
        volumes:
            - ./data/maildata:/var/mail
            - ./data/mailstate:/var/mail-state
            - ./data/maillogs:/var/log/mail
            - ./config/:/tmp/docker-mailserver/
        restart: always
        dns:
            - 8.8.8.8
            - 1.1.1.1
        networks:
            - midnightops_network

    agent:
        build:
            context: ../agent
            dockerfile: Dockerfile
        container_name: midnightops_agent
        environment:
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            - redis
        networks:
            - midnightops_network

networks:
  midnightops_network:
    driver: bridge

volumes:
    redis_data:
        driver: local
    pgdata:
        driver: local