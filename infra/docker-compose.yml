services:
    redis:
        image: redis:latest
        container_name: midnightops_redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - midnightops_network

    postgres:
        image: postgres:latest
        container_name: midnightops_postgres
        environment:
            POSTGRES_USER: midnightops
            POSTGRES_PASSWORD: midnightops
            POSTGRES_DB: midnightops_db
        ports:
            - "5432:5432"
        volumes:
            - ./initdb:/docker-entrypoint-initdb.d
            - pgdata:/var/lib/postgresql
        networks:
            - midnightops_network

    backend:
        build:
            context: ../backend
            dockerfile: Dockerfile
        container_name: midnightops_backend
        ports:
            - "3000:3000"
        expose:
            - "3000"
        environment:
            REDIS_HOST: redis
            REDIS_PORT: 6379
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_USER: midnightops
            POSTGRES_PASSWORD: midnightops
            POSTGRES_DB: midnightops_db
            VIRTUAL_HOST: midnightops.soigneux.works
            VIRTUAL_PORT: 3000
            VIRTUAL_PROTO: http
            VIRTUAL_PATH: /api,/api/
            LETSENCRYPT_HOST: midnightops.soigneux.works
        networks:
            - midnightops_network

    frontend:
        build:
            context: ../frontend
            dockerfile: Dockerfile
            args:
                VITE_API_URL: /api/v1
        container_name: midnightops_frontend
        environment:
            VITE_API_URL: /api/v1
            VIRTUAL_HOST: midnightops.soigneux.works
            VIRTUAL_PORT: 80
            VIRTUAL_PROTO: http
            LETSENCRYPT_HOST: midnightops.soigneux.works
        networks:
            - midnightops_network

    proxy:
        image: nginxproxy/nginx-proxy:1.8
        container_name: nginx-proxy
        ports:
            - "80:80"
            - "443:443"
        environment:
            ENABLE_IPV6: "false"
            DEFAULT_HOST: midnightops.soigneux.works
        volumes:
            - /var/run/docker.sock:/tmp/docker.sock:ro
            - ./certs:/etc/nginx/certs
            - nginx_vhost:/etc/nginx/vhost.d
            - nginx_html:/usr/share/nginx/html
        networks:
            - midnightops_network
        
    nginx-proxy-acme:
        image: nginxproxy/acme-companion
        container_name: nginx-proxy-acme
        environment:
            - DEFAULT_EMAIL=lukas@epitech.eu
            - NGINX_PROXY_CONTAINER=nginx-proxy
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./certs:/etc/nginx/certs
            - nginx_vhost:/etc/nginx/vhost.d
            - nginx_html:/usr/share/nginx/html
            - acme:/etc/acme.sh

    mailserver:
        image: docker.io/mailserver/docker-mailserver:latest
        hostname: mail
        domainname: soigneux.works
        container_name: mailserver
        env_file: mailserver.env
        ports:
            - "25:25"      # SMTP
            - "587:587"    # Submission
            - "993:993"    # IMAPS
        volumes:
            - ./data/maildata:/var/mail
            - ./data/mailstate:/var/mail-state
            - ./data/maillogs:/var/log/mail
            - ./config/:/tmp/docker-mailserver/
        restart: always
        networks:
            - midnightops_network

    agent:
        build:
            context: ../agent
            dockerfile: Dockerfile
        container_name: midnightops_agent
        environment:
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            - redis
        networks:
            - midnightops_network

networks:
  midnightops_network:
    driver: bridge

volumes:
    redis_data:
        driver: local
    pgdata:
        driver: local
    nginx_vhost:
        driver: local
    nginx_html:
        driver: local
    acme:
        driver: local
