services:
  redis:
    image: redis:latest
    container_name: midnightops_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - midnightops_network

  postgres:
    image: postgres:latest
    container_name: midnightops_postgres
    environment:
      POSTGRES_USER: midnightops
      POSTGRES_PASSWORD: midnightops
      POSTGRES_DB: midnightops_db
    ports:
      - "5432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql
    networks:
      - midnightops_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: midnightops_backend
    expose:
      - "3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: midnightops
      POSTGRES_PASSWORD: midnightops
      POSTGRES_DB: midnightops_db
      # expose backend via nginx-proxy
      VIRTUAL_HOST: api.midnightops.soigneux.works
      VIRTUAL_PORT: 3000
      VIRTUAL_PROTO: http
      VIRTUAL_NETWORK: midnightops_network
    networks:
      - midnightops_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://api.midnightops.soigneux.works
    container_name: midnightops_frontend
    environment:
      # Pass-through for reference; build uses ARG above
      VITE_API_URL: http://api.midnightops.soigneux.works
      VIRTUAL_HOST: midnightops.soigneux.works
      VIRTUAL_PORT: 80
      VIRTUAL_PROTO: http
      VIRTUAL_NETWORK: midnightops_network
    networks:
      - midnightops_network

  proxy:
    image: nginxproxy/nginx-proxy:1.8
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      ENABLE_IPV6: "false"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs
    networks:
      - midnightops_network

networks:
  midnightops_network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  pgdata:
    driver: local
